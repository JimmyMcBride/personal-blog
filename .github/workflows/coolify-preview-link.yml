name: Coolify Preview Link

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Update Coolify preview comment
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: ${{ format('https://{0}.{1}', github.event.pull_request.number, vars.COOLIFY_PREVIEW_HOST || 'jimmymcbride.dev') }}
    steps:
      - name: Upsert preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- coolify-preview-link -->';
            const issueNumber = context.payload.pull_request.number;
            const previewUrl = process.env.PREVIEW_URL;
            const isClosed = context.payload.action === 'closed';

            const openBody = [
              marker,
              '## Coolify Preview',
              '',
              `Preview URL: [${previewUrl}](${previewUrl})`,
              '',
              'Coolify builds or updates this preview from the repository webhook on `pull_request` events. If the URL is not live yet, wait for the Coolify deployment to finish.'
            ].join('\n');

            const closedBody = [
              marker,
              '## Coolify Preview',
              '',
              'Preview cleanup was requested for this PR.',
              '',
              previewUrl,
              '',
              'Coolify deletes PR previews automatically after the pull request is merged or closed.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const existing = comments.find((comment) => {
              return comment.user?.type === 'Bot' && comment.body?.includes(marker);
            });

            const body = isClosed ? closedBody : openBody;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
